name: Send Mi Dia reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: send-midia-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Supabase Edge Function
        env:
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          test -n "$REMINDER_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://orpzqlhdjvksdznrdybo.supabase.co/functions/v1/send-reminders" \
            --header "Authorization: Bearer $REMINDER_CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}'

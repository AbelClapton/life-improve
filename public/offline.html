<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="theme-color" content="#6366f1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Día</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; background: #f5f2eb; color: #1d2b2a; }
      body { align-items: center; display: flex; justify-content: center; margin: 0; min-height: 100vh; }
      main { max-width: 24rem; padding: 2rem; text-align: center; }
      .mark { align-items: center; background: #6366f1; border-radius: 1.5rem; color: #fff; display: inline-flex; font-size: 2rem; height: 5rem; justify-content: center; margin-bottom: 1.5rem; width: 5rem; }
      h1 { font-size: 2rem; margin: 0 0 0.75rem; }
      p { color: #687572; line-height: 1.5; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>Mi Día</h1>
      <p>Vuelve a conectarte para continuar con tu organización.</p>
    </main>
  </body>
</html>
